<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <!-- meta-tags-start -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsurePilot | Compare Insurance Plans, Get Instant Quotes & Manage Policies Online</title>
  <meta name="description"
    content="Compare health, life, auto, home, travel, and business insurance with InsurePilot. Get instant quotes, manage policies online, and experience fast, secure digital claims—all in one modern insurance platform." />
  <meta property="og:title" content="InsurePilot - Smart Insurance Management Platform">
  <meta property="og:description"
    content="Compare insurance plans, manage policies, track claims, and secure your future with InsurePilot.">
  <!-- meta-tags-start -->
  <!-- .Fontawesome CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
  <!-- owl-carousel-CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.css" />
  <!-- AOS CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
  <!-- Output CSS -->
  <link href="../../assets/css/output.css" rel="stylesheet">
  <!-- favicon-link -->
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.svg">
</head>
<body class="antialiased overflow-x-hidden">
  <!-- login-section-start -->
  <section class="log-in w-full  lg:h-dvh relative flex bg-blue-50 dark:bg-black">
    <div class="w-full h-full basis-auto hidden lg:block">
      <img src="../../assets/images/login.png" alt="login-bg" class="w-full h-full object-cover" />
    </div>
    <div
      class="w-full h-full overflow-y-auto scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100 basis-auto flex lg:items-center justify-center p-6.5  lg:p-8 xl:p-10 2xl:p-12 relative  lg:max:w-1/2 2xl:max-w-1/3">
      <div class="w-full max-w-md mx-auto text-center">
        <a href="../../index.html" class="w-auto h-auto max-w-45 lg:max-w-3xs 2xl:max-w-2xs block mb-2 xl:mb-3 mx-auto">
          <img class="w-full h-full object-cover object-center dark:hidden" alt="logo"
            src="../../assets/images/site-logo.svg" />
          <img class="w-full h-full object-cover object-center hidden dark:block" alt="logo"
            src="../../assets/images/site-whitelogo.svg" />
        </a>
        <p class="text-sm md:text-base lg:text-lg font-medium capitalize text-primary tracking-wide mb-2">Welcome back</p>
        <h1 class="text-2xl md:text-3xl font-extrabold capitalize text-black dark:text-white mb-3">Log in to your account
        </h1>
        <p class="text-sm lg:text-base text-zinc-500 font-normal mb-5 md:mb-8 xl:mb-10 dark:text-white">New to
          InsurePilot? <a href="../signup/index.html" class="font-medium text-primary hover:underline">Create a free account</a></p>
        <button
          class="secondary-btn flex items-center gap-3 w-full shadow-sm text-sm lg:text-base font-normal text-black normal-case hover:text-white focus:text-white active:text-white">
          <span class="w-auto h-auto block">
            <img src="../../assets/icons/google.svg" class="w-6 h-6 object-cover object-center" alt="">
          </span>
          <span>Continue with Google</span>
        </button>
        <div class="flex items-center gap-3 my-7 lg:my-9">
          <span class="flex-1 h-px bg-zinc-300 dark:bg-whitelight"></span>
          <span
            class="text-xs md:text-sm text-zinc-400 dark:text-white-light font-normal uppercase basis-auto tracking-wide">OR
            CONTINUE WITH EMAIL</span>
          <span class="flex-1 h-px bg-zinc-300 dark:bg-whitelight"></span>
        </div>
        <form action="">
          <div class="form-group pb-3.25 mb-2 text-start relative">
            <label for="email" class="text-sm text-black font-medium capitalize mb-1.5 inline-block dark:text-white">Email
              address</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-sm text-zinc-500 dark:text-white"><i
                  class="fa-regular fa-envelope"></i></span>
              <input type="email" name="email" id="email" placeholder="Enter your email address"
                class="w-full border border-gray-400 bg-white rounded-lg h-10 md:h-12 py-2 px-4 ps-9 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm lg:text-base font-normal text-black dark:bg-darkColor dark:text-white" />
            </div>
            <span class="text-red-600 text-xs font-normal tracking-wider absolute -bottom-1 left-0.5">Invalid email
              ID.</span>
          </div>
          <div class="form-group pb-3.25 mb-2 text-start relative">
            <div class="flex justify-between items-center mb-1.5">
              <label for="password"
                class="text-sm text-black font-medium capitalize  inline-block dark:text-white">Password</label>
              <a href="#" class="text-sm text-primary hover:underline capitalize font-medium">Forgot password?</a>
            </div>
            <div class="relative">
              <span
                class="absolute left-3 top-1/2 transform -translate-y-1/2 text-sm text-black dark:brightness-0 dark:invert ">
                <img src="../../assets/icons/lock.svg" alt="lock-img" class="w-auto h-auto object-contain" />
              </span>
              <input type="password" name="password" id="password" placeholder="Enter your password"
                class="w-full border border-gray-400 bg-white rounded-lg h-10 md:h-12 py-2 px-9 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm lg:text-base font-normal text-black dark:bg-darkColor dark:text-white" />
              <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-sm text-zinc-500"><i
                  class="fa-regular fa-eye"></i></span>
            </div>
          </div>
          <div class="form-group text-start flex items-center gap-2 mb-4 mt-2">
            <input type="checkbox" name="remember" id="remember"
              class="w-4 h-4 text-primary focus:ring-primary accent-[#027EF5] bg-white dark:bg-darkColor" />
            <label for="remember" class="text-sm dark:text-white text-zinc-500 font-normal ">Remember me</label>
          </div>
          <button type="submit" class="primary-btn flex w-full">Log in</button>
        </form>
        <p class="text-sm text-zinc-500 dark:text-white font-normal mt-5 lg:mt-7 xl:mt-10 ">By logging in, you agree to our <a
            href="#" class="text-primary hover:underline">Terms of Service</a> and <a href="#"
            class="text-primary hover:underline">Privacy Policy</a>.</p>
      </div>
    </div>
  </section>
  <!-- login-section-end -->
</body>
<!-- jQuery-CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
<!-- owl-carousel-JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
<!-- AOS Js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<!-- Custom Js -->
<script src="../../assets/js/custom.js"></script>
</html>
